<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quiniela Liga MX — Liguilla 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{--verde:#0F6E56;--rojo:#E24B4A;--gris:#5F5E5A}
    body{font-family:'DM Sans',sans-serif;background:#f7f5f0;min-height:100vh;color:#2C2C2A}
    h1,h2{font-family:'Bebas Neue',sans-serif;letter-spacing:1px}
    .app{max-width:700px;margin:0 auto;padding:1.5rem 1rem 3rem}
    .header{text-align:center;padding:1.5rem 0 1rem;border-bottom:2px solid var(--verde);margin-bottom:1.5rem}
    .header h1{font-size:2.8rem;color:var(--verde);line-height:1}
    .header p{color:var(--gris);font-size:13px;margin-top:4px}
    .tab-bar{display:flex;gap:6px;margin-bottom:1.5rem;background:#e8e5df;border-radius:10px;padding:4px}
    .tab-bar button{flex:1;padding:8px;border:none;background:transparent;border-radius:7px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;color:var(--gris);transition:all .2s}
    .tab-bar button.active{background:#fff;color:var(--verde);box-shadow:0 1px 4px rgba(0,0,0,.1)}
    .card{background:#fff;border-radius:14px;border:1px solid #e0ddd6;padding:1.25rem;margin-bottom:1rem}
    .avatar{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:18px;color:#fff;flex-shrink:0}
    .mini-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:12px;color:#fff;flex-shrink:0}
    .equipos-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
    .equipo-card{border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:10px;border:1.5px solid transparent}
    .equipo-card.vivo{border-color:#9FE1CB;background:#f0fdf7}
    .equipo-card.eliminado{border-color:#F7C1C1;background:#fff5f5;opacity:.75}
    .escudo{font-size:22px;line-height:1}
    .eq-nombre{font-size:13px;font-weight:500}
    .estado-badge{font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px;margin-top:2px;display:inline-block}
    .vivo .estado-badge{background:#9FE1CB;color:#085041}
    .eliminado .estado-badge{background:#F7C1C1;color:#501313}
    .eliminado .eq-nombre{text-decoration:line-through;color:var(--gris)}
    .score-bar{height:8px;border-radius:20px;background:#e0ddd6;margin:6px 0 2px;overflow:hidden}
    .score-fill{height:100%;border-radius:20px;background:var(--verde);transition:width .4s}
    .badge-vivos{background:#E1F5EE;color:#0F6E56;font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px}
    .badge-eli{background:#FCEBEB;color:#A32D2D;font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px}
    .login-wrap{max-width:340px;margin:3rem auto}
    .login-wrap h2{font-size:2rem;color:var(--verde);margin-bottom:.25rem;text-align:center}
    .login-wrap .sub{color:var(--gris);font-size:13px;margin-bottom:1.5rem;text-align:center}
    .player-btn{width:100%;padding:10px;border:1.5px solid #e0ddd6;border-radius:8px;background:#fff;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:14px;display:flex;align-items:center;gap:10px;margin-bottom:8px;transition:border .2s}
    .player-btn:hover{border-color:#9FE1CB}
    .player-btn.selected{border-color:var(--verde);background:#f0fdf7}
    .pass-block{background:#fff;border-radius:10px;border:1px solid #e0ddd6;padding:1rem;margin-top:4px}
    .pass-block input{width:100%;padding:9px 12px;border:1.5px solid #d3d1c7;border-radius:7px;font-family:'DM Sans',sans-serif;font-size:14px;margin-bottom:8px;outline:none;transition:border .2s}
    .pass-block input:focus{border-color:var(--verde)}
    .btn-main{width:100%;padding:11px;background:var(--verde);color:#fff;border:none;border-radius:8px;font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:1px;cursor:pointer}
    .btn-main:hover{background:#085041}
    .error-msg{color:var(--rojo);font-size:12px;margin-bottom:6px}
    .divider{border:none;border-top:.5px solid #e0ddd6;margin:1rem 0}
    .clasificacion{display:grid;gap:8px}
    .cls-item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:10px;border:1px solid #e0ddd6;background:#fff}
    .cls-rank{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;color:#D3D1C7;width:28px;text-align:center}
    .cls-rank.oro{color:#EF9F27}
    .cls-rank.plata{color:#888780}
    .cls-rank.bronce{color:#BA7517}
    .cls-info{flex:1}
    .cls-nombre{font-weight:600;font-size:14px}
    .cls-sub{font-size:12px;color:var(--gris)}
    .cls-score{font-family:'Bebas Neue',sans-serif;font-size:1.8rem;color:var(--verde)}
    .section-title{font-size:.85rem;color:var(--gris);margin-bottom:.75rem;text-transform:uppercase;letter-spacing:.5px}
    .all-teams{display:grid;grid-template-columns:1fr 1fr;gap:6px}
    .team-toggle{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;border:1px solid #e0ddd6;cursor:pointer;transition:all .2s;background:#fff}
    .team-toggle.vivo{border-color:#9FE1CB;background:#f0fdf7}
    .team-toggle.eliminado{border-color:#F7C1C1;background:#fff5f5;opacity:.7}
    .t-escudo{font-size:18px}
    .t-nombre{font-size:12px;font-weight:500;flex:1}
    .t-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
    .vivo .t-dot{background:#1D9E75}
    .eliminado .t-dot{background:#E24B4A}
    select{padding:6px 10px;border-radius:7px;border:1px solid #d3d1c7;font-family:'DM Sans',sans-serif;font-size:12px;background:#fff;color:#2C2C2A;cursor:pointer}
    @media(max-width:480px){
      .header h1{font-size:2.2rem}
      .equipos-grid{grid-template-columns:1fr}
      .all-teams{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <h1>Quiniela Liga MX</h1>
      <p>Liguilla 2026</p>
    </div>
    <div id="main-content"></div>
  </div>

  <script>
    const ADMIN_PASS = "admin123";
    const PLAYER_PASS = "salsamacha";
    const EQUIPOS_LMX = [
      {id:"ame",n:"América",e:"🦅"},{id:"gua",n:"Guadalajara",e:"🐐"},
      {id:"cru",n:"Cruz Azul",e:"⚙️"},{id:"pum",n:"Pumas",e:"🐱"},
      {id:"tol",n:"Toluca",e:"🔴"},{id:"mon",n:"Monterrey",e:"⚽"},
      {id:"tig",n:"Tigres",e:"🐯"},{id:"san",n:"Santos",e:"🌊"},
      {id:"atl",n:"Atlas",e:"🦊"},{id:"nec",n:"Necaxa",e:"⚡"},
      {id:"pue",n:"Puebla",e:"🦘"},{id:"qro",n:"Querétaro",e:"🦅"},
      {id:"maz",n:"Mazatlán",e:"🏴‍☠️"},{id:"pac",n:"Pachuca",e:"⭐"},
      {id:"jua",n:"FC Juárez",e:"🐂"},{id:"san2",n:"San Luis",e:"🏰"},
      {id:"tij",n:"Tijuana",e:"🐕"},{id:"gal",n:"Gallos",e:"🐓"},
      {id:"leo",n:"León",e:"🦁"},
    ];
    const COLORES = ["#0F6E56","#185FA5","#993C1D","#993556"];

    function getData(){try{return JSON.parse(localStorage.getItem("quiniela_lmx")||"null")}catch{return null}}
    function saveData(d){localStorage.setItem("quiniela_lmx",JSON.stringify(d))}

    function initData(){
      return {
        jugadores:[
          {id:0,nombre:"Zara",color:COLORES[0],equipos:[null,null]},
          {id:1,nombre:"Luis",color:COLORES[1],equipos:[null,null]},
          {id:2,nombre:"Sebas",color:COLORES[2],equipos:[null,null]},
          {id:3,nombre:"Eliut",color:COLORES[3],equipos:[null,null]},
        ],
        equipos: Object.fromEntries(EQUIPOS_LMX.map(e=>[e.id,{...e,vivo:true}])),
        isAdmin:false, tab:0, viewingPlayer:null,
      };
    }

    let state = getData() || initData();
    // Asegurar nombres correctos
    state.jugadores[0].nombre="Zara";
    state.jugadores[1].nombre="Luis";
    state.jugadores[2].nombre="Sebas";
    state.jugadores[3].nombre="Eliut";
    if(state.isAdmin===undefined) state.isAdmin=false;
    saveData(state);

    let selectedPlayerId = null;

    function ini(n){return n.split(" ").map(x=>x[0]).join("").slice(0,2).toUpperCase()}
    function vivos(j){return j.equipos.filter(e=>e&&state.equipos[e]&&state.equipos[e].vivo).length}

    function render(){
      const root=document.getElementById("main-content");
      if(!state.isAdmin && state.viewingPlayer===null){root.innerHTML=renderLogin();return}
      if(state.viewingPlayer!==null && !state.isAdmin){root.innerHTML=renderPlayerView();return}
      const tabs=state.isAdmin?["Perfiles","Clasificación","Equipos","Jugadores"]:["Perfiles","Clasificación"];
      root.innerHTML=`<div class="tab-bar">${tabs.map((t,i)=>`<button class="${state.tab===i?'active':''}" onclick="setTab(${i})">${t}</button>`).join("")}</div><div id="tc"></div>`;
      const tc=document.getElementById("tc");
      if(state.tab===0) tc.innerHTML=renderPerfiles();
      else if(state.tab===1) tc.innerHTML=renderClasif();
      else if(state.tab===2) tc.innerHTML=renderAdminEqs();
      else tc.innerHTML=renderAdminJugs();
    }

    function renderLogin(){
      selectedPlayerId=null;
      return `<div class="login-wrap">
        <h2>Acceso</h2>
        <p class="sub">Selecciona tu nombre e ingresa tu contraseña</p>
        ${state.jugadores.map(j=>`
          <button class="player-btn" id="pbtn-${j.id}" onclick="selectPlayer(${j.id})">
            <div class="mini-avatar" style="background:${j.color}">${ini(j.nombre)}</div>
            <span>${j.nombre}</span>
          </button>
        `).join("")}
        <div id="pass-player-block" style="display:none" class="pass-block">
          <input id="pass-player" type="password" placeholder="Contraseña" onkeydown="if(event.key==='Enter')loginPlayer()"/>
          <div id="err-player" class="error-msg" style="display:none">Contraseña incorrecta</div>
          <button class="btn-main" onclick="loginPlayer()">Entrar</button>
        </div>
        <hr class="divider"/>
        <p style="font-size:12px;color:#888;margin-bottom:8px;text-align:center">Administrador</p>
        <div class="pass-block">
          <input id="pass-admin" type="password" placeholder="Contraseña de admin" onkeydown="if(event.key==='Enter')loginAdmin()"/>
          <div id="err-admin" class="error-msg" style="display:none">Contraseña incorrecta</div>
          <button class="btn-main" onclick="loginAdmin()">Entrar como Admin</button>
        </div>
      </div>`;
    }

    function selectPlayer(id){
      selectedPlayerId=id;
      document.querySelectorAll(".player-btn").forEach(b=>b.classList.remove("selected"));
      const btn=document.getElementById("pbtn-"+id);
      if(btn) btn.classList.add("selected");
      const block=document.getElementById("pass-player-block");
      if(block){block.style.display="block";document.getElementById("pass-player").focus()}
    }

    function loginPlayer(){
      if(selectedPlayerId===null) return;
      const val=document.getElementById("pass-player").value;
      const err=document.getElementById("err-player");
      if(val===PLAYER_PASS){
        state.viewingPlayer=selectedPlayerId;state.tab=0;saveData(state);render();
      } else {err.style.display="block"}
    }

    function loginAdmin(){
      const val=document.getElementById("pass-admin").value;
      const err=document.getElementById("err-admin");
      if(val===ADMIN_PASS){state.isAdmin=true;state.viewingPlayer=null;state.tab=0;saveData(state);render()}
      else{err.style.display="block"}
    }

    function renderPlayerView(){
      const j=state.jugadores[state.viewingPlayer];
      return `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem">
        <div style="display:flex;align-items:center;gap:10px">
          <div class="avatar" style="background:${j.color}">${ini(j.nombre)}</div>
          <div><div style="font-weight:600">${j.nombre}</div><div style="font-size:12px;color:#888">Tu perfil</div></div>
        </div>
        <button onclick="logout()" style="font-size:12px;padding:6px 12px;border-radius:7px;border:1px solid #e0ddd6;background:#fff;cursor:pointer">Salir</button>
      </div>
      ${renderJugCard(j,true)}
      <div style="margin-top:1rem"><div class="section-title">Clasificación</div>${renderClasif()}</div>`;
    }

    function logout(){state.viewingPlayer=null;state.isAdmin=false;saveData(state);render()}

    function renderJugCard(j,full){
      const v=vivos(j),total=j.equipos.filter(Boolean).length,pct=total>0?Math.round(v/total*100):0;
      const eqs=j.equipos.map(eid=>{
        if(!eid) return `<div class="equipo-card" style="border:1.5px dashed #d3d1c7;background:#faf9f7;align-items:center;justify-content:center"><span style="color:#aaa;font-size:12px">Sin asignar</span></div>`;
        const eq=state.equipos[eid];
        return `<div class="equipo-card ${eq.vivo?'vivo':'eliminado'}"><span class="escudo">${eq.e}</span><div><div class="eq-nombre">${eq.n}</div><span class="estado-badge">${eq.vivo?'Activo':'Eliminado'}</span></div></div>`;
      });
      return `<div class="card">
        ${!full?`<div style="display:flex;align-items:center;gap:12px;margin-bottom:1rem">
          <div class="avatar" style="background:${j.color}">${ini(j.nombre)}</div>
          <div><div style="font-weight:600;font-size:15px">${j.nombre}</div>
            <div style="display:flex;gap:6px;margin-top:4px">
              <span class="badge-vivos">${v} vivo${v!==1?'s':''}</span>
              ${(2-v)>0?`<span class="badge-eli">${2-v} eliminado${(2-v)!==1?'s':''}</span>`:''}
            </div>
          </div>
        </div>`:''}
        <div class="equipos-grid">${eqs.join("")}</div>
        <div class="score-bar" style="margin-top:12px"><div class="score-fill" style="width:${pct}%"></div></div>
        <div style="font-size:11px;color:#888;text-align:right">${v} de ${total} equipos vivos</div>
      </div>`;
    }

    function renderPerfiles(){return state.jugadores.map(j=>renderJugCard(j,false)).join("")}

    function renderClasif(){
      const sorted=[...state.jugadores].sort((a,b)=>vivos(b)-vivos(a));
      const ranks=["oro","plata","bronce",""];
      return `<div class="clasificacion">${sorted.map((j,i)=>`<div class="cls-item">
        <div class="cls-rank ${ranks[i]||''}">${i+1}</div>
        <div class="mini-avatar" style="background:${j.color}">${ini(j.nombre)}</div>
        <div class="cls-info"><div class="cls-nombre">${j.nombre}</div>
          <div class="cls-sub">${j.equipos.filter(Boolean).map(eid=>state.equipos[eid]?.n||'').join(' · ')||'Sin equipos'}</div>
        </div>
        <div class="cls-score">${vivos(j)}<span style="font-size:12px;color:#888;font-family:'DM Sans'"> vivos</span></div>
      </div>`).join("")}</div>`;
    }

    function renderAdminEqs(){
      return `<div><div class="section-title">Toca un equipo para cambiar su estado</div>
      <div class="all-teams">${Object.keys(state.equipos).map(eid=>{
        const eq=state.equipos[eid];
        return `<div class="team-toggle ${eq.vivo?'vivo':'eliminado'}" onclick="toggleEq('${eid}')">
          <span class="t-escudo">${eq.e}</span><span class="t-nombre">${eq.n}</span><span class="t-dot"></span>
        </div>`;
      }).join("")}</div></div>`;
    }

    function renderAdminJugs(){
      const eids=Object.keys(state.equipos);
      return `<div><div class="section-title">Asignar equipos y nombres</div>
      ${state.jugadores.map(j=>`<div class="card" style="margin-bottom:.75rem">
        <div style="display:flex;align-items:center;gap:10px;border-bottom:.5px solid #f0ede8;margin-bottom:10px;padding-bottom:10px">
          <div class="mini-avatar" style="background:${j.color}">${ini(j.nombre)}</div>
          <input value="${j.nombre}" onchange="cambiarNombre(${j.id},this.value)" style="border:none;outline:none;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;background:transparent;width:150px"/>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
          ${[0,1].map(slot=>{
            const actual=j.equipos[slot];
            return `<div><div style="font-size:11px;color:#888;margin-bottom:4px">Equipo ${slot+1}</div>
              <select onchange="asignarEq(${j.id},${slot},this.value)" style="width:100%">
                <option value="">Sin asignar</option>
                ${eids.map(eid=>`<option value="${eid}" ${actual===eid?'selected':''}>${state.equipos[eid].e} ${state.equipos[eid].n}</option>`).join("")}
              </select></div>`;
          }).join("")}
        </div>
      </div>`).join("")}</div>`;
    }

    function setTab(i){state.tab=i;saveData(state);render()}
    function toggleEq(eid){state.equipos[eid].vivo=!state.equipos[eid].vivo;saveData(state);render()}
    function cambiarNombre(id,v){state.jugadores[id].nombre=v;saveData(state)}
    function asignarEq(jid,slot,eid){state.jugadores[jid].equipos[slot]=eid||null;saveData(state);render()}

    render();
  </script>
</body>
</html>
