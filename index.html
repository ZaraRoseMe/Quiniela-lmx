<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quiniela Liga MX — Liguilla 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{--verde:#0F6E56;--oro:#EF9F27;--rojo:#E24B4A;--gris:#5F5E5A;--bg:#f7f5f0}
    body{font-family:'DM Sans',sans-serif;background:var(--bg);min-height:100vh;color:#2C2C2A}
    h1,h2,h3{font-family:'Bebas Neue',sans-serif;letter-spacing:1px}
    .app{max-width:700px;margin:0 auto;padding:1.5rem 1rem 3rem}
    .header{text-align:center;padding:1.5rem 0 1rem;border-bottom:2px solid var(--verde);margin-bottom:1.5rem}
    .header h1{font-size:2.4rem;color:var(--verde);line-height:1}
    .header p{color:var(--gris);font-size:13px;margin-top:4px}
    .tab-bar{display:flex;gap:4px;margin-bottom:1.5rem;background:#e8e5df;border-radius:10px;padding:4px;flex-wrap:wrap}
    .tab-bar button{flex:1;padding:7px 4px;border:none;background:transparent;border-radius:7px;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:500;cursor:pointer;color:var(--gris);transition:all .2s;min-width:50px}
    .tab-bar button.active{background:#fff;color:var(--verde);box-shadow:0 1px 4px rgba(0,0,0,.1)}
    .card{background:#fff;border-radius:14px;border:1px solid #e0ddd6;padding:1.25rem;margin-bottom:1rem}
    .login-wrap{max-width:340px;margin:3rem auto;text-align:center}
    .login-wrap h2{font-size:2rem;color:var(--verde);margin-bottom:.5rem}
    .login-wrap p{color:var(--gris);font-size:13px;margin-bottom:1.5rem}
    .mini-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:12px;color:#fff;flex-shrink:0}
    .player-btn{width:100%;padding:10px;border:1.5px solid #e0ddd6;border-radius:8px;background:#fff;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:14px;display:flex;align-items:center;gap:10px;margin-bottom:8px;transition:border .2s}
    .player-btn:hover{border-color:#9FE1CB}
    .player-btn.selected{border-color:var(--verde);background:#f0fdf7}
    .pass-block{background:#fff;border-radius:10px;border:1px solid #e0ddd6;padding:1rem;margin-top:4px}
    .pass-block input{width:100%;padding:9px 12px;border:1.5px solid #d3d1c7;border-radius:7px;font-family:'DM Sans',sans-serif;font-size:14px;margin-bottom:8px;outline:none;transition:border .2s}
    .pass-block input:focus{border-color:var(--verde)}
    .btn-main{width:100%;padding:11px;background:var(--verde);color:#fff;border:none;border-radius:8px;font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:1px;cursor:pointer}
    .btn-main:hover{background:#085041}
    .error-msg{color:var(--rojo);font-size:12px;margin-bottom:8px}
    .divider{border:none;border-top:.5px solid #e0ddd6;margin:1rem 0}
    .ronda-badge{display:inline-block;padding:4px 16px;border-radius:20px;font-size:12px;font-weight:600;letter-spacing:1px;margin-bottom:1rem}
    .ronda-1{background:#E1F5EE;color:#0F6E56}
    .ronda-2{background:#FEF3E2;color:#C27A00}
    .maquina{background:#1a1a2e;border-radius:16px;padding:1.5rem;margin-bottom:1.5rem;text-align:center;position:relative;overflow:hidden}
    .maquina::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:radial-gradient(ellipse at center,rgba(15,110,86,0.2) 0%,transparent 70%);pointer-events:none}
    .equipo-display{height:80px;display:flex;align-items:center;justify-content:center}
    .equipo-nombre-slot{font-family:'Bebas Neue',sans-serif;font-size:2.4rem;letter-spacing:2px;color:#fff;text-shadow:0 0 20px rgba(0,245,255,0.5)}
    .equipo-nombre-slot.rolling{animation:roll .08s ease-in-out infinite}
    .equipo-nombre-slot.revealed{animation:reveal .5s ease-out forwards}
    @keyframes roll{0%{transform:translateY(-4px);opacity:.6}50%{transform:translateY(4px);opacity:1}100%{transform:translateY(-4px);opacity:.6}}
    @keyframes reveal{0%{transform:scale(1.5);opacity:0}50%{transform:scale(0.92)}80%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
    .escudo-display{font-size:3rem;margin-bottom:.5rem;min-height:50px;display:flex;align-items:center;justify-content:center}
    .pos-display{font-size:.85rem;color:#EF9F27;letter-spacing:2px;font-family:'Bebas Neue',sans-serif;margin-bottom:.25rem;min-height:20px}
    .para-quien{font-size:13px;color:#aaa;letter-spacing:1px;margin-bottom:.5rem}
    .para-quien span{color:var(--oro);font-weight:600}
    .btn-sortear{width:100%;padding:14px;background:var(--verde);color:#fff;border:none;border-radius:10px;font-family:'Bebas Neue',sans-serif;font-size:1.3rem;letter-spacing:2px;cursor:pointer;transition:all .2s;margin-bottom:1rem}
    .btn-sortear:hover:not(:disabled){background:#085041;transform:translateY(-1px)}
    .btn-sortear:disabled{background:#ccc;cursor:not-allowed}
    .btn-sortear.spinning{background:#C27A00;animation:pulse .6s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}
    .esperando-box{text-align:center;padding:14px;background:#fff;border-radius:10px;border:1px solid #e0ddd6;font-size:13px;color:var(--gris)}
    .esperando-box.animando{background:#1a1a2e;border-color:#f5c518;color:#f5c518;font-family:'Bebas Neue',sans-serif;font-size:1.1rem;letter-spacing:2px;animation:pulse .8s ease-in-out infinite}
    .resultados{display:grid;gap:10px}
    .resultado-item{border-radius:10px;padding:10px 14px;display:flex;align-items:center;gap:12px;border:1.5px solid #9FE1CB;background:#f0fdf7}
    .resultado-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:14px;color:#fff;flex-shrink:0}
    .resultado-info{flex:1}
    .resultado-nombre{font-weight:600;font-size:14px}
    .resultado-escudo{font-size:1.5rem}
    .badge-ronda{font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px}
    .badge-r1{background:#E1F5EE;color:#0F6E56}
    .badge-r2{background:#FEF3E2;color:#C27A00}
    .separador-ronda{text-align:center;margin:12px 0;font-family:'Bebas Neue',sans-serif;font-size:1rem;letter-spacing:2px;color:var(--gris)}
    .btn-reiniciar{width:100%;padding:10px;background:transparent;border:1.5px solid var(--rojo);color:var(--rojo);border-radius:8px;font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;margin-top:.5rem}
    .btn-reiniciar:hover{background:#fff0f0}
    .avatar{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:18px;color:#fff;flex-shrink:0}
    .equipos-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
    .equipo-card{border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:10px;border:1.5px solid transparent}
    .equipo-card.vivo{border-color:#9FE1CB;background:#f0fdf7}
    .equipo-card.eliminado{border-color:#F7C1C1;background:#fff5f5;opacity:.75}
    .eq-nombre{font-size:13px;font-weight:500}
    .estado-badge{font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px;margin-top:2px;display:inline-block}
    .vivo .estado-badge{background:#9FE1CB;color:#085041}
    .eliminado .estado-badge{background:#F7C1C1;color:#501313}
    .eliminado .eq-nombre{text-decoration:line-through;color:var(--gris)}
    .score-bar{height:8px;border-radius:20px;background:#e0ddd6;margin:6px 0 2px;overflow:hidden}
    .score-fill{height:100%;border-radius:20px;background:var(--verde);transition:width .4s}
    .badge-vivos{background:#E1F5EE;color:#0F6E56;font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px}
    .badge-eli{background:#FCEBEB;color:#A32D2D;font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px}
    .clasificacion{display:grid;gap:8px}
    .cls-item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:10px;border:1px solid #e0ddd6;background:#fff}
    .cls-rank{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;color:#D3D1C7;width:28px;text-align:center}
    .cls-rank.oro{color:#EF9F27}.cls-rank.plata{color:#888780}.cls-rank.bronce{color:#BA7517}
    .cls-info{flex:1}
    .cls-nombre{font-weight:600;font-size:14px}
    .cls-sub{font-size:12px;color:var(--gris)}
    .cls-score{font-family:'Bebas Neue',sans-serif;font-size:1.8rem;color:var(--verde)}
    .section-title{font-size:.85rem;color:var(--gris);margin-bottom:.75rem;text-transform:uppercase;letter-spacing:.5px}
    .all-teams{display:grid;grid-template-columns:1fr 1fr;gap:6px}
    .team-toggle{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;border:1px solid #e0ddd6;cursor:pointer;transition:all .2s;background:#fff}
    .team-toggle.vivo{border-color:#9FE1CB;background:#f0fdf7}
    .team-toggle.eliminado{border-color:#F7C1C1;background:#fff5f5;opacity:.7}
    .t-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
    .vivo .t-dot{background:#1D9E75}.eliminado .t-dot{background:#E24B4A}
    select{padding:6px 10px;border-radius:7px;border:1px solid #d3d1c7;font-family:'DM Sans',sans-serif;font-size:12px;background:#fff;color:#2C2C2A;cursor:pointer}
    /* LLAVE */
    .fecha-sep{background:#f7f5f0;border-radius:10px;padding:7px 14px;font-size:12px;font-weight:600;color:var(--verde);margin:1rem 0 .5rem;display:flex;align-items:center;gap:6px}
    .ronda-label{font-family:'Bebas Neue',sans-serif;font-size:1rem;letter-spacing:2px;color:var(--gris);text-transform:uppercase;margin:1.5rem 0 .75rem;border-bottom:1px solid #e0ddd6;padding-bottom:4px}
    .partido{background:#fff;border-radius:12px;border:1px solid #e0ddd6;margin-bottom:.6rem;overflow:hidden}
    .partido-header{background:#f7f5f0;padding:5px 14px;font-size:11px;color:var(--gris);letter-spacing:.5px;display:flex;justify-content:space-between;align-items:center}
    .partido-header .horario{color:var(--verde);font-weight:600;font-size:12px}
    .partido-equipos{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:11px 14px}
    .equipo-lado{display:flex;flex-direction:column;gap:2px}
    .equipo-lado.derecha{text-align:right;align-items:flex-end}
    .equipo-nombre-match{font-weight:600;font-size:14px;display:flex;align-items:center;gap:5px}
    .equipo-nombre-match.elim{text-decoration:line-through;color:#aaa}
    .dueno-match{font-size:11px;color:var(--gris);margin-top:1px}
    .dueno-match.elim{text-decoration:line-through;color:#ccc}
    .vs-badge{font-family:'Bebas Neue',sans-serif;font-size:1rem;color:#D3D1C7;letter-spacing:1px}
    .pos-chip{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;font-size:10px;font-weight:700;flex-shrink:0}
    .badge-ida{background:#E1F5EE;color:#0F6E56;font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px}
    .badge-vuelta{background:#FEF3E2;color:#C27A00;font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px}
    .placeholder-card{background:#fff;border-radius:12px;border:1.5px dashed #d3d1c7;padding:14px 16px;margin-bottom:.75rem;display:flex;align-items:center;justify-content:center;gap:8px;color:#bbb;font-size:13px}
    .reglas-box{background:#fff;border-radius:12px;border:1px solid #e0ddd6;padding:1rem;margin-bottom:1.5rem;font-size:12px;color:var(--gris);line-height:1.8}
    .reglas-box strong{color:#2C2C2A}
    .fase-info{background:#f7f5f0;border-radius:10px;padding:12px 14px;margin-top:1rem;font-size:12px;color:var(--gris);line-height:1.9}
    .fase-info strong{color:var(--verde);font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:.5px}
    .confetti-container{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:999}
    .confetti-piece{position:absolute;width:10px;height:10px;border-radius:2px;animation:fall linear forwards}
    @keyframes fall{0%{transform:translateY(-20px) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
    .loading{text-align:center;padding:3rem;color:var(--gris);font-size:14px}
    .live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#22c55e;margin-right:5px;animation:blink 1.5s ease-in-out infinite}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
    @media(max-width:480px){.equipos-grid{grid-template-columns:1fr}.all-teams{grid-template-columns:1fr}.partido-equipos{gap:4px;padding:9px 10px}}
  </style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>🏆 Quiniela Liga MX</h1>
    <p>Liguilla 2026</p>
  </div>
  <div id="main-content"><div class="loading">Conectando...</div></div>
</div>
<div class="confetti-container" id="confetti"></div>

<script>
const SUPABASE_URL='https://tdelfskddnqgdfcdapiv.supabase.co';
const SUPABASE_KEY='sb_publishable_uCNBVXyPWMXFkuU639MIEg_HzBIatJw';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const ADMIN_PASS='admin123';
const PLAYER_PASS='salsamacha';
const COLORES=['#0F6E56','#185FA5','#993C1D','#993556'];

const EQUIPOS_R1=[
  {id:'pum',n:'Pumas',e:'🐱',pos:1},
  {id:'chi',n:'Chivas',e:'🐐',pos:2},
  {id:'cru',n:'Cruz Azul',e:'⚙️',pos:3},
  {id:'pac',n:'Pachuca',e:'⭐',pos:4},
];
const EQUIPOS_R2=[
  {id:'tol',n:'Toluca',e:'🔴',pos:5},
  {id:'atl',n:'Atlas',e:'🦊',pos:6},
  {id:'tig',n:'Tigres',e:'🐯',pos:7},
  {id:'ame',n:'América',e:'🦅',pos:8},
];
const TODOS_EQUIPOS=[...EQUIPOS_R1,...EQUIPOS_R2];

// Cruces IDA y VUELTA con horarios correctos
// IDA: local juega en casa primero
// Cruce A: Tigres(7) vs Chivas(2) — ida Tigres casa, vuelta Chivas casa
// Cruce B: Atlas(6) vs Cruz Azul(3) — ida Atlas casa, vuelta Cruz Azul casa
// Cruce C: América(8) vs Pumas(1) — ida América casa, vuelta Pumas casa
// Cruce D: Toluca(5) vs Pachuca(4) — ida Toluca casa, vuelta Pachuca casa

const PARTIDOS_IDA=[
  {local:'tig',visita:'chi',fecha:'Sáb 2 Mayo',hora:'19:00'},
  {local:'atl',visita:'cru',fecha:'Sáb 2 Mayo',hora:'21:15'},
  {local:'ame',visita:'pum',fecha:'Dom 3 Mayo',hora:'17:00'},
  {local:'tol',visita:'pac',fecha:'Dom 3 Mayo',hora:'19:15'},
];
const PARTIDOS_VUELTA=[
  {local:'chi',visita:'tig',fecha:'Sáb 9 Mayo',hora:'19:07'},
  {local:'cru',visita:'atl',fecha:'Sáb 9 Mayo',hora:'21:15'},
  {local:'pac',visita:'tol',fecha:'Dom 10 Mayo',hora:'17:00'},
  {local:'pum',visita:'ame',fecha:'Dom 10 Mayo',hora:'19:15'},
];

const JUGADORES=[
  {id:0,nombre:'Zara',color:COLORES[0]},
  {id:1,nombre:'Luis',color:COLORES[1]},
  {id:2,nombre:'Sebas',color:COLORES[2]},
  {id:3,nombre:'Eliut',color:COLORES[3]},
];

const DEFAULT={
  jugadores:[
    {id:0,nombre:'Zara',color:COLORES[0],equipos:[null,null]},
    {id:1,nombre:'Luis',color:COLORES[1],equipos:[null,null]},
    {id:2,nombre:'Sebas',color:COLORES[2],equipos:[null,null]},
    {id:3,nombre:'Eliut',color:COLORES[3],equipos:[null,null]},
  ],
  equipos:Object.fromEntries(TODOS_EQUIPOS.map(e=>[e.id,{...e,vivo:true}])),
  asignaciones:[],
};

let state=null;
let session={isAdmin:false,viewingPlayer:null,tab:0};
let selectedPlayerId=null,spinning=false,playerAnimating=false,prevAsigCount=0;

async function loadState(){
  const{data,error}=await sb.from('quiniela').select('data').eq('id','state').single();
  if(error||!data||!data.data||!data.data.jugadores){state=JSON.parse(JSON.stringify(DEFAULT));await saveState();}
  else{state=data.data;if(!state.asignaciones)state.asignaciones=[];if(!state.equipos)state.equipos=Object.fromEntries(TODOS_EQUIPOS.map(e=>[e.id,{...e,vivo:true}]));}
}
async function loadSorteo(){
  const{data,error}=await sb.from('sorteo').select('data').eq('id','state').single();
  if(!error&&data&&data.data&&data.data.asignaciones){
    state.asignaciones=data.data.asignaciones;
    state.asignaciones.forEach(a=>{const slot=a.ronda===1?0:1;if(state.jugadores[a.jugId])state.jugadores[a.jugId].equipos[slot]=a.equipo.id;});
  }
  prevAsigCount=state.asignaciones.length;
}
async function saveState(){await sb.from('quiniela').upsert({id:'state',data:state});}
async function saveSorteo(){await sb.from('sorteo').upsert({id:'state',data:{asignaciones:state.asignaciones}});await saveState();}

sb.channel('sorteo-rt').on('postgres_changes',{event:'UPDATE',schema:'public',table:'sorteo'},payload=>{
  if(!session.isAdmin&&!spinning&&!playerAnimating){
    const newAsig=payload.new.data.asignaciones||[];
    if(newAsig.length>prevAsigCount){
      const newest=newAsig[newAsig.length-1];
      const rondaEqs=newest.ronda===1?EQUIPOS_R1:EQUIPOS_R2;
      runPlayerAnimation(newest,rondaEqs,()=>{
        state.asignaciones=newAsig;
        newAsig.forEach(a=>{const slot=a.ronda===1?0:1;if(state.jugadores[a.jugId])state.jugadores[a.jugId].equipos[slot]=a.equipo.id;});
        prevAsigCount=newAsig.length;
        const nr1=state.asignaciones.filter(a=>a.ronda===1).length;
        const nr2=state.asignaciones.filter(a=>a.ronda===2).length;
        if(nr1===4||nr2===4)lanzarConfetti();
        render();
      });
    }
  }
}).subscribe();

sb.channel('quiniela-rt').on('postgres_changes',{event:'UPDATE',schema:'public',table:'quiniela'},payload=>{
  if(!session.isAdmin){const ns=payload.new.data;if(ns&&ns.jugadores){state.jugadores=ns.jugadores;state.equipos=ns.equipos;render();}}
}).subscribe();

function runPlayerAnimation(asig,rondaEqs,onDone){
  if(session.tab!==0){onDone();return;}
  playerAnimating=true;
  const tc=document.getElementById('tc');if(!tc)return;
  const jugActual=JUGADORES[asig.jugId];
  tc.innerHTML=`
    <div style="text-align:center;margin-bottom:1rem"><h2 style="font-family:'Bebas Neue',sans-serif;font-size:2rem;color:var(--verde)">🎰 SORTEO</h2></div>
    <div style="text-align:center;margin-bottom:1rem"><span class="ronda-badge ${asig.ronda===1?'ronda-1':'ronda-2'}">${asig.ronda===1?'⚽ RONDA 1':'🏆 RONDA 2'}</span></div>
    <div class="maquina">
      <div class="para-quien">Le toca a: <span>${jugActual.nombre}</span></div>
      <div class="escudo-display" id="esc">🎰</div>
      <div class="pos-display" id="pos-disp"></div>
      <div class="equipo-display"><div class="equipo-nombre-slot rolling" id="eq-nom">???</div></div>
    </div>
    <div id="esperando-box" class="esperando-box animando">🎰 ¡SORTEANDO!</div>
  `;
  const nomEl=document.getElementById('eq-nom');
  const escEl=document.getElementById('esc');
  const posEl=document.getElementById('pos-disp');
  let tick=0;const totalTicks=25;
  const interval=setInterval(()=>{
    tick++;
    const r=rondaEqs[Math.floor(Math.random()*rondaEqs.length)];
    if(nomEl){nomEl.textContent=r.n;nomEl.className='equipo-nombre-slot rolling';}
    if(escEl)escEl.textContent=r.e;
    if(posEl)posEl.textContent=`POSICIÓN #${r.pos}`;
    if(tick>=totalTicks){
      clearInterval(interval);
      const eq=asig.equipo;
      if(nomEl){nomEl.textContent=eq.n;nomEl.className='equipo-nombre-slot revealed';}
      if(escEl)escEl.textContent=eq.e;
      if(posEl)posEl.textContent=`POSICIÓN #${eq.pos} — ${eq.pos<=4?'TOP 4 🔥':'Semifinalista'}`;
      setTimeout(()=>{playerAnimating=false;onDone();},1600);
    }
  },80);
}

function ini(n){return n.split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase();}
function vivos(j){return j.equipos.filter(e=>e&&state.equipos[e]&&state.equipos[e].vivo).length;}
function posColor(pos){
  if(pos<=2)return{bg:'#FFD700',c:'#7A5900'};
  if(pos<=4)return{bg:'#E1F5EE',c:'#0F6E56'};
  if(pos<=6)return{bg:'#FEF3E2',c:'#C27A00'};
  return{bg:'#FCEBEB',c:'#A32D2D'};
}
function getDueno(eqId){const j=state.jugadores.find(j=>j.equipos.includes(eqId));return j?j.nombre:null;}
function eqById(id){return TODOS_EQUIPOS.find(e=>e.id===id);}

function render(){
  const root=document.getElementById('main-content');
  if(!session.isAdmin&&session.viewingPlayer===null){root.innerHTML=renderLogin();return;}
  const isPlayer=session.viewingPlayer!==null&&!session.isAdmin;
  const tabs=session.isAdmin
    ?[{i:'🎰',n:'Sorteo'},{i:'👥',n:'Perfiles'},{i:'🏆',n:'Tabla'},{i:'📅',n:'Llave'},{i:'⚽',n:'Equipos'},{i:'👤',n:'Jugadores'}]
    :[{i:'🎰',n:'Sorteo'},{i:'👥',n:'Perfiles'},{i:'🏆',n:'Tabla'},{i:'📅',n:'Llave'}];
  let header='';
  if(isPlayer){
    const j=state.jugadores[session.viewingPlayer];
    header=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem">
      <div style="display:flex;align-items:center;gap:10px">
        <div class="avatar" style="background:${j.color}">${ini(j.nombre)}</div>
        <div><div style="font-weight:600">${j.nombre}</div><div style="font-size:12px;color:#888">Tu perfil</div></div>
      </div>
      <button onclick="logout()" style="font-size:12px;padding:6px 12px;border-radius:7px;border:1px solid #e0ddd6;background:#fff;cursor:pointer">Salir</button>
    </div>`;
  }
  root.innerHTML=`
    ${header}
    <div style="display:flex;align-items:center;gap:6px;margin-bottom:.5rem">
      <span class="live-dot"></span><span style="font-size:11px;color:#22c55e;font-weight:600">EN VIVO</span>
    </div>
    <div class="tab-bar">
      ${tabs.map((t,i)=>`<button class="${session.tab===i?'active':''}" onclick="setTab(${i})">${t.i}<span style="font-size:9px;display:block;margin-top:-1px">${t.n}</span></button>`).join('')}
      ${session.isAdmin?`<button onclick="logout()" style="background:transparent;border:none;color:#aaa;cursor:pointer;font-size:10px;padding:6px 2px">Salir</button>`:''}
    </div>
    <div id="tc"></div>
  `;
  const tc=document.getElementById('tc');
  if(session.tab===0)tc.innerHTML=renderSorteo();
  else if(session.tab===1)tc.innerHTML=renderPerfiles();
  else if(session.tab===2)tc.innerHTML=renderClasif();
  else if(session.tab===3)tc.innerHTML=renderLlave();
  else if(session.tab===4)tc.innerHTML=renderAdminEqs();
  else tc.innerHTML=renderAdminJugs();
}

  return `
    <div style="text-align:center;margin-bottom:1.5rem">
      <h2 style="font-family:'Bebas Neue',sans-serif;font-size:2rem;color:var(--verde)">🎉 ¡SORTEO COMPLETO!</h2>

function listaAsig(){
  const r1=state.asignaciones.filter(a=>a.ronda===1);
  const r2=state.asignaciones.filter(a=>a.ronda===2);
  let html='<div class="resultados">';
  if(r1.length){html+=`<div class="separador-ronda">— Ronda 1 (#1–#4) —</div>`;html+=r1.map(itemAsig).join('');}
  if(r2.length){html+=`<div class="separador-ronda">— Ronda 2 (#5–#8) —</div>`;html+=r2.map(itemAsig).join('');}
  html+='</div>';return html;
}

function itemAsig(a){
  const j=JUGADORES[a.jugId];const pc=posColor(a.equipo.pos);
  return `<div class="resultado-item">
    <div class="resultado-avatar" style="background:${j.color}">${ini(j.nombre)}</div>
    <div class="resultado-info">
      <div class="resultado-nombre">${j.nombre}</div>
      <div style="display:flex;align-items:center;gap:5px;margin-top:3px;font-size:12px;color:var(--gris)">
        <span style="background:${pc.bg};color:${pc.c};border-radius:50%;width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0">${a.equipo.pos}</span>
        <span>${a.equipo.n}</span>
      </div>
    </div>
    <span class="resultado-escudo">${a.equipo.e}</span>
    <span class="badge-ronda ${a.ronda===1?'badge-r1':'badge-r2'}">R${a.ronda}</span>
  </div>`;
}

async function iniciarSorteo(){
  if(spinning||!session.isAdmin)return;spinning=true;
  const r1Done=state.asignaciones.filter(a=>a.ronda===1).length;
  const ronda=r1Done<4?1:2;
  const turnoIdx=ronda===1?r1Done:state.asignaciones.filter(a=>a.ronda===2).length;
  const equiposRonda=ronda===1?[...EQUIPOS_R1]:[...EQUIPOS_R2];
  const asigIds=state.asignaciones.filter(a=>a.ronda===ronda).map(a=>a.equipo.id);
  const disponibles=equiposRonda.filter(e=>!asigIds.includes(e.id));
  const ganador=disponibles[Math.floor(Math.random()*disponibles.length)];
  const btn=document.getElementById('btn-s');
  const nomEl=document.getElementById('eq-nom');
  const escEl=document.getElementById('esc');
  const posEl=document.getElementById('pos-disp');
  if(btn){btn.disabled=true;btn.classList.add('spinning');btn.textContent='🎰 SORTEANDO...';}
  let tick=0;const totalTicks=30;
  const interval=setInterval(()=>{
    tick++;
    const r=equiposRonda[Math.floor(Math.random()*equiposRonda.length)];
    if(nomEl){nomEl.textContent=r.n;nomEl.className='equipo-nombre-slot rolling';}
    if(escEl)escEl.textContent=r.e;
    if(posEl)posEl.textContent=`POSICIÓN #${r.pos}`;
    if(tick>=totalTicks){
      clearInterval(interval);
      if(nomEl){nomEl.textContent=ganador.n;nomEl.className='equipo-nombre-slot revealed';}
      if(escEl)escEl.textContent=ganador.e;
      if(posEl)posEl.textContent=`POSICIÓN #${ganador.pos} — ${ganador.pos<=4?'TOP 4 🔥':'Semifinalista'}`;
      setTimeout(async()=>{
        state.asignaciones.push({jugId:turnoIdx,equipo:ganador,ronda});
        const slot=ronda===1?0:1;state.jugadores[turnoIdx].equipos[slot]=ganador.id;
        prevAsigCount=state.asignaciones.length;
        await saveSorteo();spinning=false;
        const nr1=state.asignaciones.filter(a=>a.ronda===1).length;
        const nr2=state.asignaciones.filter(a=>a.ronda===2).length;
        if(nr1===4||nr2===4)lanzarConfetti();
        render();
      },1400);
    }
  },70+(tick*4));
}

async function reiniciarSorteo(){
  if(!session.isAdmin)return;
  if(!confirm('¿Reiniciar el sorteo?'))return;
  state.asignaciones=[];state.jugadores.forEach(j=>j.equipos=[null,null]);
  prevAsigCount=0;await saveSorteo();render();
}

    const eq=eqById(eqId);
    const eq2=state.equipos[eqId];
    const vivo=eq2?eq2.vivo:true;
    const dueno=getDueno(eqId);
    const pc=posColor(eq.pos);
    const ec=!vivo?'elim':'';
    if(side==='L'){return `<div class="equipo-lado">
      <div class="equipo-nombre-match ${ec}">
        <span style="font-size:1.1rem">${eq.e}</span><span>${eq.n}</span>
        <span class="pos-chip" style="background:${pc.bg};color:${pc.c}">${eq.pos}</span>
      </div>
      <div class="dueno-match ${ec}">${dueno?`👤 ${dueno}`:'👤 –'}</div>
    </div>`;}
    return `<div class="equipo-lado derecha">
      <div class="equipo-nombre-match ${ec}">
        <span class="pos-chip" style="background:${pc.bg};color:${pc.c}">${eq.pos}</span>
        <span>${eq.n}</span><span style="font-size:1.1rem">${eq.e}</span>

      ?`<span class="badge-ida">IDA</span>`

    return `<div class="partido">
      <div class="partido-header">

      </div>
      <div class="partido-equipos">
        ${ladoHtml(p.local,'L')}
        <div class="vs-badge">VS</div>
        ${ladoHtml(p.visita,'R')}

  const letras=['A','B','C','D'];

      <p style="font-size:12px;color:var(--gris);margin-top:4px">Liguilla 2026 · Todos los horarios en hora del centro de México</p>
    </div>
    <div class="reglas-box">
      <strong>Cruces:</strong> 1 vs 8 · 2 vs 7 · 3 vs 6 · 4 vs 5 &nbsp;·&nbsp;
      <strong>Avanza:</strong> mejor marcador global · En empate avanza mejor posicionado &nbsp;·&nbsp;
      <strong>Final:</strong> puede haber T.E. o penales
    </div>

    <div class="ronda-label">⚽ Cuartos de Final — IDA</div>
    <div class="fecha-sep">📅 Sábado 2 de Mayo</div>
    ${partidoHtml(PARTIDOS_IDA[0],'ida','A')}
    ${partidoHtml(PARTIDOS_IDA[1],'ida','B')}
    <div class="fecha-sep">📅 Domingo 3 de Mayo</div>
    ${partidoHtml(PARTIDOS_IDA[2],'ida','C')}
    ${partidoHtml(PARTIDOS_IDA[3],'ida','D')}

    <div class="ronda-label">🔁 Cuartos de Final — VUELTA</div>
    <div class="fecha-sep">📅 Sábado 9 de Mayo</div>
    ${partidoHtml(PARTIDOS_VUELTA[0],'vuelta','A')}
    ${partidoHtml(PARTIDOS_VUELTA[1],'vuelta','B')}
    <div class="fecha-sep">📅 Domingo 10 de Mayo</div>
    ${partidoHtml(PARTIDOS_VUELTA[2],'vuelta','C')}
    ${partidoHtml(PARTIDOS_VUELTA[3],'vuelta','D')}

    <div class="ronda-label">🏅 Semifinales</div>
    <div class="placeholder-card">⏳ Ganador A vs Ganador D</div>
    <div class="placeholder-card">⏳ Ganador B vs Ganador C</div>

    <div class="ronda-label">🏆 Gran Final</div>
    <div class="placeholder-card">🏆 Los 2 ganadores de Semifinales</div>

    <div class="fase-info">
      <strong>📅 FECHAS APROXIMADAS</strong><br>
      Semifinales (ida y vuelta): 14 – 18 de mayo<br>

function renderPerfiles(){return state.jugadores.map(j=>renderJugCard(j)).join('');}
function renderJugCard(j){
  const v=vivos(j),total=j.equipos.filter(Boolean).length,pct=total>0?Math.round(v/total*100):0;
  const eqs=j.equipos.map(eid=>{
    if(!eid)return`<div class="equipo-card" style="border:1.5px dashed #d3d1c7;background:#faf9f7;align-items:center;justify-content:center"><span style="color:#aaa;font-size:12px">Sin asignar</span></div>`;
    const eq=state.equipos[eid];if(!eq)return'';
    const pc=posColor(eq.pos||9);
    return `<div class="equipo-card ${eq.vivo?'vivo':'eliminado'}">
      <span style="font-size:18px">${eq.e}</span>
      <div>
        <div style="display:flex;align-items:center;gap:4px;margin-bottom:2px">
          <span style="background:${pc.bg};color:${pc.c};border-radius:50%;width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:700">${eq.pos||'?'}</span>
          <div class="eq-nombre">${eq.n}</div>
        </div>
        <span class="estado-badge">${eq.vivo?'Activo':'Eliminado'}</span>
      </div>
    </div>`;
  });
  return `<div class="card">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:1rem">
      <div class="avatar" style="background:${j.color}">${ini(j.nombre)}</div>
      <div><div style="font-weight:600;font-size:15px">${j.nombre}</div>
        <div style="display:flex;gap:6px;margin-top:4px">
          <span class="badge-vivos">${v} vivo${v!==1?'s':''}</span>
          ${(2-v)>0?`<span class="badge-eli">${2-v} eliminado${(2-v)!==1?'s':''}</span>`:''}
        </div>
      </div>
    </div>
    <div class="equipos-grid">${eqs.join('')}</div>
    <div class="score-bar" style="margin-top:12px"><div class="score-fill" style="width:${pct}%"></div></div>
    <div style="font-size:11px;color:#888;text-align:right">${v} de ${total} equipos vivos</div>
  </div>`;
}

  return `<div class="clasificacion">${sorted.map((j,i)=>`<div class="cls-item">
    <div class="cls-rank ${ranks[i]||''}">${i+1}</div>
    <div class="mini-avatar" style="background:${j.color}">${ini(j.nombre)}</div>
    <div class="cls-info">
      <div class="cls-nombre">${j.nombre}</div>
      <div class="cls-sub">${j.equipos.filter(Boolean).map(eid=>state.equipos[eid]?.n||'').join(' · ')||'Sin equipos'}</div>

    <div class="cls-score">${vivos(j)}<span style="font-size:12px;color:#888;font-family:'DM Sans'"> vivos</span></div>

function setTab(i){session.tab=i;render();}
async function toggleEq(eid){state.equipos[eid].vivo=!state.equipos[eid].vivo;render();await saveState();}
function cambiarNombre(id,v){state.jugadores[id].nombre=v;saveState();}
async function asignarEq(jid,slot,eid){state.jugadores[jid].equipos[slot]=eid||null;render();await saveState();}

function lanzarConfetti(){
  const container=document.getElementById('confetti');
  const colors=['#0F6E56','#EF9F27','#E24B4A','#185FA5','#b347ff','#FFD700'];
  for(let i=0;i<70;i++){
    const el=document.createElement('div');el.className='confetti-piece';
    el.style.cssText=`left:${Math.random()*100}%;background:${colors[Math.floor(Math.random()*colors.length)]};animation-duration:${1+Math.random()*2}s;animation-delay:${Math.random()*0.5}s;transform:rotate(${Math.random()*360}deg)`;
    container.appendChild(el);setTimeout(()=>el.remove(),3000);
  }
}

function selectPlayer(id){
  selectedPlayerId=id;
  document.querySelectorAll('.player-btn').forEach(b=>b.classList.remove('selected'));
  const btn=document.getElementById('pbtn-'+id);if(btn)btn.classList.add('selected');
  const block=document.getElementById('pass-player-block');
  if(block){block.style.display='block';document.getElementById('pass-player').focus();}
}
function loginPlayer(){
  if(selectedPlayerId===null)return;
  const val=document.getElementById('pass-player').value;
  const err=document.getElementById('err-player');
  if(val===PLAYER_PASS){session.viewingPlayer=selectedPlayerId;session.tab=0;render();}
  else err.style.display='block';
}
function loginAdmin(){
  const val=document.getElementById('pass-admin').value;
  const err=document.getElementById('err-admin');
  if(val===ADMIN_PASS){session.isAdmin=true;session.viewingPlayer=null;session.tab=0;render();}
  else err.style.display='block';
}
function logout(){session.viewingPlayer=null;session.isAdmin=false;render();}

async function init(){await loadState();await loadSorteo();render();}
init();
</script>
